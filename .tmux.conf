# -------------------------
# Developer Layout Presets
# -------------------------

# 1 pane (focus mode)
bind-key 1 run-shell "tmux kill-pane -a"

# 2 panes (dev mode)
bind-key 2 run-shell "
  tmux kill-pane -a
  tmux split-window -h
  tmux select-layout even-horizontal
"

# 3 panes
bind-key 3 run-shell "
  tmux kill-pane -a
  tmux split-window -h
  tmux split-window -v
  tmux select-layout tiled
"

# 4 panes
bind-key 4 run-shell "
  tmux kill-pane -a
  tmux split-window -h
  tmux split-window -v
  tmux select-pane -t 0
  tmux split-window -v
  tmux select-layout tiled
"

# 6 panes
bind-key 6 run-shell "
  tmux kill-pane -a
  i=1
  while [ \"$i\" -le 5 ]; do
    tmux split-window
    i=$((i + 1))
  done
  tmux select-layout tiled
"

# 8 panes (monitor mode)
bind-key 8 run-shell "
  tmux kill-pane -a
  i=1
  while [ \"$i\" -le 7 ]; do
    tmux split-window
    i=$((i + 1))
  done
  tmux select-layout tiled
"

# 9: toggle zoom for current pane
bind-key 9 resize-pane -Z

# Grid auto-arrange helper
bind-key g select-layout tiled
